[build-system]
requires = ["setuptools==69.0.3", "wheel==0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ovacast-hgsoc"
version = "1.0.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.1.2",
  "transformers==4.36.2",
  "peft==0.7.1",
  "accelerate==0.25.0",
  "numpy==1.26.3",
  "pandas==2.1.4",
  "scipy==1.11.4",
  "scikit-learn==1.3.2",
  "lifelines==0.27.8",
  "pyyaml==6.0.1"
]

[project.scripts]
ovacast-train = "ovacast.entrypoints.train:main"
ovacast-evaluate = "ovacast.entrypoints.evaluate:main"
ovacast-prepare = "ovacast.entrypoints.prepare:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["verification"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
disable_error_code = ["no-any-return", "attr-defined", "arg-type", "call-overload", "var-annotated"]
