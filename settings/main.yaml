model:
  identifier: BioMistral/BioMistral-7B
  context_length: 32768
  hidden_size: 4096
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, v_proj]
training:
  phases:
    - {name: genomic, epochs: 5, explanation: false}
    - {name: multimodal, epochs: 10, explanation: false}
    - {name: explanation, epochs: 3, explanation: true}
  optimizer: AdamW
  learning_rate: 0.0003
  warmup_ratio: 0.10
  weight_decay: 0.10
  batch_size: 4
  gradient_accumulation: 8
  precision: bf16
  modality_dropout: 0.30
  explanation_weight: 0.10
  early_stopping_patience: 5
  seeds: [42, 123, 256, 512, 1024]
evaluation:
  test_fraction: 0.30
  internal_validation_fraction: 0.15
  bootstrap_resamples: 1000
  landmark_months: 60
  tier1_folds: 5
  tier1_repeats: 3
hardware:
  accelerator: NVIDIA A100
  count: 1
  memory_gb: 80
  cuda: "12.1"
  expected_gpu_hours: 18
